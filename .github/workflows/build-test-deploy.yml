name: build-test-deploy

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'README.md'

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: 'Release'

jobs:

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

  deploy:
    name: deploy
    needs: build-and-test
    # Деплой только после пуша в master, а не из любой ветки или PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to VPS
      # Версия закреплена коммитом (v1.2.5), чтобы изменения в чужом репозитории не попадали в деплой без ревью.
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
      with:
        username: ${{ secrets.SSH_USERNAME }}
        host: ${{ secrets.SSH_HOST }}
        password: ${{ secrets.SSH_PASSWORD }}
        script: |
          cd app/Solarlab.Academy-2023/
          git pull
          docker-compose up -d --build
