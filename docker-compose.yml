# Требуется Docker Compose v2 (`docker compose`) или docker-compose >= 1.29:
# старт сервисов ждёт готовности БД и завершения миграций (depends_on.condition).
#
# Секреты берутся из переменных окружения или файла .env рядом с этим файлом
# (см. .env.example). Файл .env в репозиторий не коммитится.

services:

  api:
    container_name: solarlab-academy-api
    build:
      context: .
      dockerfile: src/Board/Host/Board.Host.Api/Dockerfile
    ports:
      - 5000:8080
    environment:
      - ConnectionStrings__PostgresBoardDb=Server=postgres;Database=Board;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set};Port=5432
      - Jwt__Key=${JWT_KEY:?JWT_KEY is not set}
      - AutoMapper__LicenseKey=${AUTOMAPPER_LICENSE_KEY:-}
      - Administration__AdminLogins__0=${ADMIN_LOGIN:-}
    networks:
      - solarlab-academy-network
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully

  migrator:
    container_name: solarlab-academy-migrator
    build:
      context: .
      dockerfile: src/Board/Host/Board.Host.DbMigrator/Dockerfile
    environment:
      - ConnectionStrings__PostgresBoardDb=Server=postgres;Database=Board;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set};Port=5432
    networks:
      - solarlab-academy-network
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      # Только с локальной машины (на сервере — через SSH-туннель).
      - "127.0.0.1:8080:8080"
    networks:
      - solarlab-academy-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_DB: "Board"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Board"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Только с локальной машины, наружу БД не публикуется.
      - "127.0.0.1:5432:5432"
    networks:
      - solarlab-academy-network
  
volumes:
  pg-data:
  
networks:
  solarlab-academy-network:
